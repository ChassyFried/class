<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Map</title>
    <style>
        html,
        body,
        #map {
            width: 100%;
            height: 100%;
            height: 100dvh;
            margin: 0;
        }


        #search-panel {
            position: absolute;
            top: 15px;
            left: 15px;
            z-index: 3;
            width: 290px;
            padding: 12px;
            box-sizing: border-box;
            background: white;
            border-radius: 8px;
            box-shadow: 0 2px 10px #0003;
            font-family: Arial, sans-serif;
        }

        #results-sidebar {
            position: absolute;
            top: 105px;
            left: 0;
            bottom: 0;
            width: 320px;
            overflow-y: auto;
            background: white;
            z-index: 2;
            padding: 16px;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
            box-shadow: 2px 0 8px #0003;
            margin-left: 15px;
            margin-right: 15px;
            border-radius: 9px;
        }

        #search-form {
            display: flex;
            gap: 8px;
        }

        #search-input {
            min-width: 0;
            flex: 1;
            padding: 10px;
            box-sizing: border-box;
        }

        #search-form button {
            padding: 10px 14px;
            cursor: pointer;
        }


        button {
            background-color: rgb(69, 100, 158);
            color: white;
        }

        #results-sidebar h2 {
            margin-top: 0;
        }

        #results-count {
            color: #555;
            font-size: 13px;
            margin-bottom: 8px;
        }

        .result-item {
            display: flex;
            gap: 10px;
            padding: 12px 6px;
            border-bottom: 1px solid #ddd;
            cursor: pointer;
        }

        .result-item:hover {
            background: #f3f3f3;
        }

        .result-item.active {
            background: #e8f0fe;
        }

        .result-item img {
            width: 75px;
            height: 65px;
            object-fit: cover;
            flex-shrink: 0;
        }

        .result-item h3 {
            margin: 0 0 6px;
            font-size: 15px;
        }

        .result-item p {
            margin: 0;
            font-size: 12px;
            color: #555;
        }

        #status {
            font-size: 13px;
            color: #555;
            margin-top: 8px;
        }

        @media (max-width: 600px) {
            #results-sidebar {
                width: 220px;
                padding: 10px;
            }

            #search-panel {
                left: 230px;
                width: calc(100vw - 242px);
                padding: 8px;
            }

            #search-form {
                flex-direction: column;
            }

            #search-form button {
                width: 100%;
            }

            .result-item img {
                width: 50px;
                height: 50px;
            }
        }

        .wiki-marker {
            display: flex;
            flex-direction: column;
            align-items: center;
            width: 100px;
            cursor: pointer;
            transition: transform 0.15s ease;
        }

        .wiki-marker:hover {
            transform: scale(1.08);
            z-index: 10;
        }

        .wiki-marker img {
            display: block;
            width: 52px;
            height: 52px;
            box-sizing: border-box;
            border: 3px solid white;
            border-radius: 50%;
            object-fit: cover;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .wiki-marker-title {
            max-width: 140px;
            margin-top: 4px;
            padding: 2px 5px;
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
            box-sizing: border-box;
            border-radius: 4px;
            background: rgba(0, 0, 0, 0.75);
            color: white;
            font: 600 12px/1.4 Arial, sans-serif;
            text-align: center;
        }

        .wiki-marker-fallback {
            display: flex;
            align-items: center;
            justify-content: center;
            min-width: 70px;
            min-height: 40px;
            padding: 6px;
            box-sizing: border-box;
            border: 2px solid white;
            border-radius: 8px;
            background: #555;
            box-shadow: 0 2px 6px rgba(0, 0, 0, 0.4);
        }

        .wiki-marker-fallback .wiki-marker-title {
            max-width: 140px;
            margin: 0;
            white-space: normal;
            overflow-wrap: anywhere;
            background: transparent;
            text-shadow: none;
        }
    </style>
</head>

<body>
    <div id="search-panel">
        <form id="search-form">
            <input id="search-input" type="search" placeholder="Search Wikipedia places, e.g. park" required>
            <button type="submit">Search</button>
            <button id="clear" type="button">Clear Map</button>
        </form>

    </div>

    <div id="results-sidebar">
        <h2>Search Results</h2>
        <div id="results-list"></div>
    </div>

    <div id="map"></div>

    <script>
        (g => {
            var h, a, k,
                p = "The Google Maps JavaScript API",
                c = "google",
                l = "importLibrary",
                q = "__ib__",
                m = document,
                b = window;

            b = b[c] || (b[c] = {});

            var d = b.maps || (b.maps = {}),
                r = new Set(),
                e = new URLSearchParams(),
                u = () => h || (h = new Promise(async (f, n) => {
                    await (a = m.createElement("script"));
                    e.set("libraries", [...r] + "");

                    for (k in g) {
                        e.set(
                            k.replace(/[A-Z]/g, t => "_" + t[0].toLowerCase()),
                            g[k]
                        );
                    }

                    e.set("callback", c + ".maps." + q);
                    a.src = `https://maps.${c}apis.com/maps/api/js?` + e;
                    d[q] = f;
                    a.onerror = () => h = n(Error(p + " could not load."));
                    a.nonce = m.querySelector("script[nonce]")?.nonce || "";
                    m.head.append(a);
                }));

            d[l]
                ? console.warn(p + " only loads once. Ignoring:", g)
                : d[l] = (f, ...n) => r.add(f) && u().then(() => d[l](f, ...n));
        })({
            key: "AIzaSyB3D-Anos5nKjFwwVy1PxJfDQWHxrVFTiw",
            v: "weekly"
        });
    </script>

    <script src="map.js" type="module"></script>
</body>

</html>
